<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Frontend Project</title>

        <link rel="stylesheet" href="css/style.css">
    </head>

    <body>
        <main class="auth">

            <section class="auth__form">
                <h1>Sign in</h1>
                <p class="subtitle">Your music journy starts here</p>

                <form>
                    <div class="input-group">
                        <input type="email" placeholder="Entrer your e-mail" required>
                    </div>
                    <div class="input-group">
                        <input type="password" placeholder="Entrer your password" required>
                    </div>
                    <div class="options">
                        <label>
                            <input type="checkbox">
                            Remembre me
                        </label>
                    </div>

                    <button type="submit" class="btn primary">Sign in</button>

                    <div class="separator"Or></div>

                    <button type="button" class="btn google">
                        Continue with google
                    </button>

                    <button type="button" class="btn apple">
                        Continue with apple
                    </button>
                </form>
                
                <p class="redirect">
                    Don't have an Account ? <a href="signup.html">sign up</a>
                </p>

            </section>

            <section class="auth__image">
                <img>
            </section>



        </main>


        <script src="js/main.js"></script>
    </body>

</html>
