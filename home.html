<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Platform - Home</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- NAVBAR -->
    <header class="navbar">
        <div class="navbar__logo">Music</div>

        <nav class="navbar__menu">
            <a href="home.html" class="active">Home</a>
            <a href="news.html">News</a>
            <a href="concert.html">Concert</a>
            <a href="account.html">Account</a>
            <a href="settings.html">Settings</a>
        </nav>

        <div class="navbar__profile">
            <img src="assets/images/ysf.jpeg" alt="Profile">

    </header>

    <!-- MAIN -->
    <main class="page home">

        <section class="hero">

            <p>Listen to your favorite artists anytime, anywhere.</p>
        </section>

        <!-- PLAYLISTS -->
        <section class="section">

        </section>

        <!-- ARTISTS -->
        <section class="section">
            <h2>Top Artists</h2>

            <div class="cards">
                <div class="card">Artist 1</div>
                <div class="card">Artist 2</div>
                <div class="card">Artist 3</div>

    <script src="js/main.js"></script>
